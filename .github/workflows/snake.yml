name: snake

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23e0555f&color_dots=%23ebedef,%23f0c9cc,%23dd8a90,%23c0454e,%238a1f28
            dist/snake-dark.svg?color_snake=%23e0555f&color_dots=%230d1117,%233a1418,%236b2028,%239e2f3a,%23e0555f
            dist/snake.gif?color_snake=%23e0555f&color_dots=%230d1117,%233a1418,%236b2028,%239e2f3a,%23e0555f

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
